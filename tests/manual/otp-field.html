<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OTPinsert – lokaler Feldtest</title>
<style>
  :root { color-scheme: dark; font-family: 'Segoe UI', system-ui, sans-serif; background: #10141d; color: #f3f6fc; }
  body { max-width: 480px; margin: 12vh auto; padding: 24px; }
  main { background: #191f2b; border: 1px solid #303a4b; border-radius: 18px; padding: 28px; }
  h1 { font-size: 24px; margin-top: 0; }
  p { color: #9caac0; line-height: 1.6; }
  label { display: block; margin: 24px 0 8px; }
  input { box-sizing: border-box; width: 100%; padding: 12px; color: #f3f6fc; background: #10141d; border: 1px solid #526178; border-radius: 10px; font: 22px 'Segoe UI', sans-serif; }
  input:focus { outline: 2px solid #8de8d1; outline-offset: 2px; }
  small { color: #9caac0; }
</style>
<main>
  <h1>Echte Mail, lokales Code-Feld</h1>
  <p>Nach erfolgreicher IMAP-Verbindung eine neue Code-Mail anfordern. Sobald der Code im Dashboard erscheint, dieses leere Feld anklicken.</p>
  <label for="verification-code">Verification code</label>
  <input id="verification-code" name="verification-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="Code aus deiner Mail">
  <p><small>Diese Seite hat keine Netzwerkanfragen und sendet nichts ab. Sie prueft nur den Vorschlag und das Einfuegen in ein einzelnes Feld.</small></p>
</main>
</html>
